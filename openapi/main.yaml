  /bus/admin/countInServiceBus:
    get:
      tags:
        - "Bus"
      summary: "Count buses in service"
      description: "Get number of buses with status 'En service' (admin only)"
      operationId: countInServiceBus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
