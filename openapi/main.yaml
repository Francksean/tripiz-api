  /trip/driver/{tripId}/status:
    patch:
      tags:
        - Trip
      summary: Update trip status
      operationId: updateTripStatus
      security:
        - bearerAuth: [ ]
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequestDTO'
      responses:
        '200':
