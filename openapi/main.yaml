openapi: "3.0.3"
info:
  title: "Tripiz API"
  description: "Backend application for Tripiz app"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080"
    description: "Local server"

tags:
  - name: "Authentication"
    description: "Authentication and user registration"
  - name: "User"
    description: "Operations on users (admin only)"
  - name: "Bus"
    description: "Operations on bus"
  - name: "Station"
    description: "Operations on stations"
  - name: "Itinerary"
    description: "Operations on itineraries"
  - name: "Trip"
    description: "Operations on trips"

paths:
  /auth/register:
    post:
      tags:
        - "Authentication"
      summary: "Register a new client account"
      description: "Public endpoint for client sign-up"
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestDTO'
      responses:
        '201':
          description: "User registered successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponseDTO'
        '400':
          description: "Invalid input or email already exists"
        '500':
          description: "Server error"

  /auth/register/driver:
    post:
      tags:
        - "Authentication"
      summary: "Register a new driver account"
      description: "Admin-only endpoint for driver registration"
      operationId: registerDriver
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequestDTO'
      responses:
        '201':
          description: "Driver registered successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponseDTO'
        '400':
          description: "Invalid input or email already exists"
        '401':
          description: "Unauthorized (missing or invalid token)"
        '403':
          description: "Forbidden (insufficient privileges)"
        '500':
          description: "Server error"

  /user/{id}:
    patch:
      tags:
        - "User"
      summary: "Update a user"
      description: "Update user details by ID (admin only)"
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: "User ID"
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequestDTO'
      responses:
        '200':
          description: "User updated successfully"
        '400':
          description: "Invalid input"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "User not found"

  /user/delete/{id}:
    delete:
      tags:
        - "User"
      summary: "Delete a user"
      description: "Delete a user by ID (admin only)"
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "User deleted successfully"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "User not found"

  /user/getById/{id}:
    get:
      tags:
        - "User"
      summary: "Get user by id"
      description: "Get a user by its id"
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "User found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: "Not found"

  /user/getDriverById/{id}:
    get:
      tags:
        - "User"
      summary: "Get driver by id"
      description: "Get a user with the role Driver by its id"
      operationId: getDriverById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "User found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDTO'
        '404':
          description: "Not found"

  /user/admin/users:
    get:
      tags:
        - "User"
      summary: "Get all users"
      description: "Retrieve list of all users (admin only)"
      operationId: getAllUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDTO'
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /user/admin/drivers:
    get:
      tags:
        - "User"
      summary: "Get all drivers"
      description: "Retrieve list of all users with role Driver (admin only)"
      operationId: getDrivers
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: array
                items:
