        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /bus/admin/totalCapacity:
    get:
      tags:
        - "Bus"
      summary: "Total capacity of buses in service"
      description: "Sum of capacities of all buses in service (admin only)"
      operationId: getTotalCapacity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /bus/delete/{id}:
    delete:
      tags:
        - "Bus"
      summary: "Delete a bus"
      description: "Delete a bus by ID (admin only)"
      operationId: deleteBus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Bus deleted successfully"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Not Found"

  /bus/{id}:
    patch:
