  /station/admin/countInMaintenanceStation:
    get:
      tags:
        - "Station"
      summary: "Count stations in maintenance"
      description: "Get number of stations with status 'En maintenance' (admin only)"
      operationId: countInMaintenanceStation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /station/admin/countAllStations:
    get:
      tags:
        - "Station"
      summary: "Count total stations"
      description: "Get total number of stations (admin only)"
      operationId: countAllStations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"


  /itinerary/admin/createItinerary:
    post:
      tags:
        - "Itinerary"
      summary: "Create a new itinerary"
      description: "Register a new itinerary (admin only)"
      operationId: createItinerary
      security:
        - bearerAuth: []
      requestBody:
        required: true
