      tags:
        - "Itinerary"
      summary: "Delete an itinerary"
      description: "Delete an itinerary by ID (admin only)"
      operationId: deleteItinerary
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
