        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /user/admin/countOnline:
    get:
      tags:
        - "User"
      summary: "Count online users"
      description: "Get number of users with status ONLINE (admin only)"
      operationId: countOnlineUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Count of online users"
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /user/admin/countBlocked:
    get:
      tags:
        - "User"
      summary: "Count blocked users"
      description: "Get number of users with status BLOCKED (admin only)"
      operationId: countBlockedUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Count of blocked users"
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /user/admin/countTotalUsers:
    get:
      tags:
        - "User"
      summary: "Count total users"
      description: "Get total number of registered users (admin only)"
      operationId: countTotalUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Total number of users"
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /user/admin/countCreatedThisMonth:
    get:
      tags:
        - "User"
      summary: "Count users created this month"
      description: "Get number of users registered in the current month (admin only)"
      operationId: countUsersCreatedThisMonth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Count of users created this month"
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /bus/createBus:
    post:
      tags:
        - "Bus"
      summary: "Create a new bus"
      description: "Register a new bus (admin only)"
      operationId: createBus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusRequestDTO'
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBusResponseDTO'
        '400':
          description: "Bad Request"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /bus/admin/buses:
    get:
      tags:
        - "Bus"
      summary: "Get all buses"
      description: "Retrieve list of all buses (admin only)"
      operationId: getAllBuses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: array
                items:
