  /trip/admin/countAllTrips:
    get:
      tags:
        - "Trip"
      summary: "Count total trips"
      description: "Get total number of trips (admin only)"
      operationId: countAllTrips
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /trip/admin/getAll:
    get:
      tags:
        - "Trip"
      summary: "Get all trips"
      description: "Retrieve list of all trips (admin only)"
      operationId: getAllTrips
      security:
