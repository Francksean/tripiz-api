      tags:
        - "Trip"
      summary: "Create a new trip"
      description: "Register a new trip (admin or driver)"
      operationId: createTrip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequestDTO'
