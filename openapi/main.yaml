          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStationRequestDTO'
      responses:
        '200':
          description: "Station updated successfully"
        '400':
          description: "Invalid input"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Not found"

  /station/delete/{id}:
    delete:
      tags:
        - "Station"
      summary: "Delete a station"
      description: "Delete a station by ID (admin only)"
      operationId: deleteStation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Station deleted successfully"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Not Found"

  /station/admin/countInServiceStation:
    get:
      tags:
        - "Station"
      summary: "Count stations in service"
      description: "Get number of stations with status 'En service' (admin only)"
      operationId: countInServiceStation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
