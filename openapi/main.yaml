          application/json:
            schema:
              $ref: '#/components/schemas/CreateItineraryRequestDTO'
      responses:
        '200':
          description: "Success"
        '400':
          description: "Bad Request"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /itinerary/{id}:
    get:
      tags:
        - "Itinerary"
      summary: "Get itinerary by ID"
      description: "Retrieve a single itinerary by its UUID"
      operationId: getItineraryById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Itinerary found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryResponseDTO'
        '404':
          description: "Not found"

  /itinerary/getStation/{id}:
    get:
      tags:
        - "Itinerary"
      summary: "Get itineraries by station ID"
      description: "Retrieve all itineraries associated with a departure station"
      operationId: getItinerariesByStation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Itineraries found"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryResponseDTO'
        '404':
          description: "Not found"

  /itinerary/admin/getAll:
    get:
      tags:
        - "Itinerary"
      summary: "Get all itineraries"
      description: "Retrieve list of all itineraries (admin only)"
      operationId: getAllItineraries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
          content:
            application/json:
              schema:
                type: array
