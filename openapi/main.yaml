  /bus/{id}/position:
    get:
      tags:
        - "Bus"
      summary: "Get current position of a bus"
      description: "Returns the latest known GPS position of a bus."
      operationId: getBusPosition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Bus position found"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusPositionDTO'
        '404':
          description: "Bus not connected or position unavailable"

  /bus/positions:
    get:
      tags:
        - "Bus"
      summary: "Get all connected buses positions"
      description: "Returns the latest known positions of all connected buses."
      operationId: getAllBusPositions
      responses:
        '200':
          description: "List of bus positions"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusPositionDTO'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----- Authentication -----
    SignupRequestDTO:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          example: "Password123"
          minLength: 8
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        phone:
          type: string
          example: "0123456789"

    SignupResponseDTO:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          example: "client"

    # ----- User -----
    UpdateUserRequestDTO:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        status:
          type: string
          example: "ONLINE"

    UserDTO:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        status:
          type: string
        role:
          type: string
        createdAt:
          type: string

    # ----- Bus -----
    CreateBusRequestDTO:
      type: object
      required:
        - busNumber
        - matriculation
        - capacity
        - status
      properties:
        busNumber:
          type: integer
        matriculation:
          type: string
        capacity:
          type: integer
        status:
          type: string
          example: "En service"

    CreateBusResponseDTO:
      type: object
      properties:
        busId:
          type: string
          format: uuid

    BusDTO:
      type: object
      properties:
        busId:
          type: string
          format: uuid
        busNumber:
          type: integer
        matriculation:
          type: string
        capacity:
          type: integer
        status:
          type: string

    UpdateBusRequestDTO:
      type: object
      properties:
        busNumber:
          type: integer
        matriculation:
          type: string
        capacity:
          type: integer
        status:
          type: string

    PositionMessageType:
      type: string
      enum:
        - JOIN
        - UPDATE
        - LEAVE

    BusPositionDTO:
      type: object
      properties:
        bus_id:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        type:
          $ref: '#/components/schemas/PositionMessageType'

    # ----- Station -----
    CreateStationRequestDTO:
      type: object
      required:
        - stationName
        - address
        - latitude
        - longitude
      properties:
        stationName:
          type: string
        address:
          type: string
        stationType:
          type: string
        status:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    StationDTO:
      type: object
      properties:
        stationId:
          type: string
          format: uuid
        stationName:
          type: string
        address:
          type: string
        stationType:
          type: string
        status:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    # ----- Itinerary -----
    CreateItineraryRequestDTO:
      type: object
      required:
        - route_name
        - direction
        - departure_station
        - arrival_station
      properties:
        route_name:
          type: string
        direction:
          type: string
          enum: [ALLER, RETOUR]
        itinerary_name:
          type: string
        estimated_duration:
          type: integer
        departure_station:
          type: string
          format: uuid
        arrival_station:
          type: string
          format: uuid
        distance:
          type: number
          format: double

    ItineraryResponseDTO:
      type: object
      properties:
        itinerary_id:
          type: string
          format: uuid
        route_name:
          type: string
        direction:
          type: string
        itinerary_name:
          type: string
        estimated_duration:
          type: integer
        departure_station:
          $ref: '#/components/schemas/StationDTO'
        arrival_station:
          $ref: '#/components/schemas/StationDTO'
        distance:
          type: number
          format: double

    # ----- Trip -----
    TripStatus:
      type: string
      enum:
        - PROGRAMME
        - EN_COURS
        - ANNULE
        - TERMINE

    CreateTripRequestDTO:
      type: object
      required:
        - bus_id
        - driver_id
        - itinerary_id
        - trip_date
        - schedule_departure
      properties:
        bus_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        itinerary_id:
          type: string
          format: uuid
        trip_date:
          type: string
          format: date
          example: "2026-06-30"
        schedule_departure:
          type: string
          format: time
          example: "08:00:00"
        actual_departure:
          type: string
          format: time
          example: "08:05:00"
        trip_status:
          $ref: '#/components/schemas/TripStatus'
        passenger_count:
          type: integer

    TripDTO:
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        bus_id:
          type: string
          format: uuid
        driver_id:
          type: string
          format: uuid
        itinerary_id:
          type: string
          format: uuid
        trip_date:
          type: string
          format: date
        schedule_departure:
          type: string
          format: time
        actual_departure:
          type: string
          format: time
        trip_status:
          $ref: '#/components/schemas/TripStatus'
        passenger_count:
          type: integer

    TripStatisticsDTO:
      type: object
      properties:
        programmed:
          type: integer
        ongoing:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer

    UpdateTripStatusRequestDTO:
      type: object
      required:
        - tripStatus
      properties:
        tripStatus:
          $ref: '#/components/schemas/TripStatus'