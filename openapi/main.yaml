  /trip/admin/getStatistics:
    get:
      tags:
        - "Trip"
      summary: "Get statistics"
      description: "Retrieve the statistics about all the trips (admin only)"
      operationId: getStatistics
      security:
        - bearerAuth: [ ]
      responses:
        '200':
