              schema:
                type: integer
                format: int32
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"

  /bus/admin/countInMaintenanceBus:
    get:
      tags:
        - "Bus"
      summary: "Count buses in maintenance"
      description: "Get number of buses with status 'En maintenance' (admin only)"
      operationId: countInMaintenanceBus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Success"
