        '404':
          description: "Not found"

  /trip/admin/delete/{id}:
    delete:
      tags:
        - "Trip"
      summary: "Delete a trip"
      description: "Delete a trip by ID (admin only)"
      operationId: deleteTrip
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Trip deleted successfully"
        '401':
          description: "Unauthorized"
        '403':
          description: "Forbidden"
        '404':
          description: "Not Found"

  /trip/admin/patch/{id}:
    patch:
      tags:
        - "Trip"
      summary: "Update a trip"
      description: "Update trip details by ID (admin only)"
      operationId: updateTrip
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
