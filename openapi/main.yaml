        - Trip
      summary: "Get today's trips for the authenticated driver"
      operationId: getTodayTrips
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Today's trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripDTO'
        '401':
